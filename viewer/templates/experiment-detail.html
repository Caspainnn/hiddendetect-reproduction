<section class="section" aria-labelledby="table-title"><div class="bar"><div class="section-head"><h2 id="table-title">实验对照</h2><span id="count" class="count"></span></div><div class="tools" aria-label="筛选实验"><button class="on" data-filter="all">全部</button><button data-filter="EI">读取信息 EI</button><button data-filter="OC">加工与判分 OC</button><button data-filter="CFG">共同读取设置</button></div></div><div class="table-scroll"><table><thead><tr><th scope="col">做了什么实验</th><th scope="col">为什么做</th><th scope="col">怎么做</th><th scope="col">关键指标怎么变</th><th scope="col">能得出什么结论</th></tr></thead><tbody id="rows"></tbody></table></div><p class="caption">AUROC：越大，越能把危险和安全输入分开。误报率：安全输入被误拦的比例，越低越好。召回率：危险输入被抓住的比例，越高越好。<br>每个“原来 → 现在”都来自该实验自己的同批对照；不同批次的数字不能直接排名。“差异未确认”表示现有数据还不足以下定论。</p></section>
</main><script src="projects.js"></script><script>
const experiments=[
{topic:'centroid',group:'EI',name:'EI-1 加上质心距离',why:'拒绝分数只有一条线索，离安全或危险样本中心有多远，会不会也有用？',how:'把拒绝分数 F 和质心距离 C 一起交给逻辑回归判断。',metrics:'AUROC <span class="metric">0.83740 → <em>0.87402</em></span>',batch:'历史监督实验；两侧都使用训练得到的判断规则。',verdict:'这套训练框架下，加上距离信息有提升。还不能据此说原论文直接加一个距离就会提高。',status:'历史监督结果',source:'results/signal-selection/report-2026-10-28.md'},
{topic:'logits',group:'EI',name:'EI-2 读取完整 logits',why:'压成一个拒绝分数后，可能丢掉了有用信息。',how:'读取完整的输出信息，再使用历史监督框架进行判断。',metrics:'AUROC <span class="metric">0.83740 → <em>0.87822</em></span>',batch:'历史监督实验；与后面的原规则实验不是同一套比较。',verdict:'保留更多信息在这套框架下有用，尚未证明不训练判断规则也能获得相同提升。',status:'历史监督结果',source:'docs/experiment-rounds.md'},
{topic:'position',group:'EI',name:'EI-3 用户输入的不同位置',why:'模板末尾会不会漏掉用户输入里更早出现的危险线索？',how:'固定原算分规则，分别读取用户首位、25%、50%、75%、90%和末位。',metrics:'原模板末位 AUROC <span class="metric">0.746640</span><br>六个用户位置 <span class="metric">0.518152～0.670976</span>',batch:'同批历史 1,000 条；用户末位是六个位置中最高的。',verdict:'这些用户位置都比模板末位差。本轮继续把模板末位作为读取位置。',status:'没有改善',source:'results/original-positions/report-2026-10-30.md'},
{topic:'position',group:'EI',name:'EI-3 模板倒数第二个位置',why:'紧挨着原读取位置，会不会有更清楚的信号？',how:'先比较模板末尾三个位置，再固定倒数第二个位置，用另一批新样本确认。',metrics:'新确认 AUROC <span class="metric">0.771068 → <em>0.786908</em></span><br>误报率 <span class="metric">4.8% → 6.2%</span><br>召回率 <span class="metric">29.8% → 29.8%</span>',batch:'新同源 1,000 条；左侧是同批原模板末位。',verdict:'区分能力的数值更高，但提升还没确认；误拦更多安全输入，暂不替换原末位。',status:'提升未确认',source:'results/original-template-confirm/report-2026-10-30.md'},
{topic:'layers',group:'EI',name:'EI-4 补充对照：原 FDV 方法',why:'默认层范围可能不适合当前输入，原论文的选层规则能否选得更好？',how:'用同样的256条选择样本，按危险与安全输入的逐层平均分差，选出 [12,28]。',metrics:'AUROC <span class="metric">0.776240 → <em>0.801085</em></span><br>误报率 <span class="metric">4.5% → 5.0%</span><br>召回率 <span class="metric">33.3% → 40.7%</span>',batch:'新同源 2,000 条；左侧均为默认 [16,29]。',verdict:'比默认范围更能区分危险和安全输入，但这个阈值下误报稍多。',status:'区分能力提高',source:'results/layer-selection/report-2026-10-30.md'},
{topic:'layers',group:'EI',name:'EI-4-1 直接穷举连续区间',why:'不预先猜哪些层最好，能不能把所有连续范围都试一遍？',how:'在256条选择样本上比较全部496个连续区间，取AUROC最高的 [9,19]，再用新样本确认。',metrics:'AUROC <span class="metric">0.776240 → <em>0.829589</em></span><br>误报率 <span class="metric">4.5% → <em>3.8%</em></span><br>召回率 <span class="metric">33.3% → <em>47.1%</em></span>',batch:'新同源 2,000 条；各方法用同一批安全样本提前定阈值。',verdict:'本轮综合数值最好，区分能力提升得到确认。与重采样方法的差异尚未确认；换模型要重新选层。',status:'区分能力提高',source:'results/layer-selection/report-2026-10-30.md'},
{topic:'layers',group:'EI',name:'EI-4-2 重采样选层',why:'一次选出的最高分，可能只是碰巧适合那一小批样本。',how:'反复把选择样本分成两半，优先选在较差情况下也表现好的区间，得到 [8,20]。',metrics:'AUROC <span class="metric">0.776240 → <em>0.828034</em></span><br>误报率 <span class="metric">4.5% → <em>3.9%</em></span><br>召回率 <span class="metric">33.3% → <em>46.7%</em></span>',batch:'同一批新确认 2,000 条；位置和算分规则与直接比较相同。',verdict:'优于默认范围，但暂未看出比简单地逐个比较更好。',status:'额外优势未确认',source:'results/layer-selection/report-2026-10-30.md'},
{topic:'aggregation',group:'OC',name:'OC 换一种汇总方法',why:'原来的积分会不会受少数层的极端分数影响？',how:'固定读取位置和层范围，比较原积分、均值、最高4层、截尾和连续4层窗口。',metrics:'均值 AUROC <span class="metric">0.759299 → <em>0.762188</em></span><br>低误报区间得分 <span class="metric">0.648989 → <em>0.651721</em></span><br>误报率 <span class="metric">3.8% → 4.1%</span><br>召回率 <span class="metric">34.6% → 35.7%</span>',batch:'另一批新同源 2,000 条；这里左侧是该批原积分结果。',verdict:'均值在低误报区间有小幅改善；最高几层和窗口虽有更高AUROC，原定的低误报收益还未确认。',status:'小幅改善',source:'results/pure-oc/report-2026-10-30.md'}
];
let filter='all';
function render(){const list=experiments.filter(x=>filter==='all'||x.group===filter||x.topic===filter);document.getElementById('count').textContent=list.length+' 项实验';document.getElementById('rows').innerHTML=list.map(x=>`<tr><td><strong>${x.name}</strong><span class="tag ${/未确认|没有/.test(x.status)?'caution':''}">${x.status}</span><small><a class="source" href="../../${x.source}" target="_blank" rel="noopener">查看实验记录 ↗</a></small></td><td>${x.why}</td><td>${x.how}</td><td>${x.metrics}<small>${x.batch}</small></td><td>${x.verdict}</td></tr>`).join('');document.querySelectorAll('.tools [data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===filter));}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render();}));
/* EXPERIMENT_MINDMAP */
render();
</script><script>
