<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验 · 论文阅读笔记</title><style>
:root{--paper:#fffefa;--bg:#f7f7f2;--text:#26332b;--muted:#748075;--green:#28563b;--soft:#edf3e9;--line:#dce2d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--green)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #84a481;outline-offset:4px}header{height:77px;display:flex;align-items:center;gap:50px;border-bottom:1px solid var(--line);padding:0 4%}.brand{font:bold 23px Georgia,SimSun,serif;color:var(--green);white-space:nowrap}nav{display:flex;gap:8px}nav a{padding:8px 19px;text-decoration:none;color:var(--muted)}nav .active{background:var(--soft);color:var(--green);border-radius:6px;font-weight:600}.prototype{margin-left:auto;color:var(--muted);font-size:12px}main{max-width:1440px;padding:38px 4% 70px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:25px}h1{font:700 40px/1.3 Georgia,SimSun,serif;color:var(--green);margin:0}p{margin:8px 0;color:var(--muted)}.primary{padding:9px 18px;color:white;background:var(--green);border:1px solid var(--green);border-radius:6px;white-space:nowrap}.primary:hover{background:#376c4a}.section-heading{margin:36px 0 17px;display:flex;align-items:center;gap:12px;font-weight:600}.count{font-size:12px;font-weight:400;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:white;transition:box-shadow .18s,border-color .18s;display:flex;flex-direction:column}.card:hover{border-color:#9db394;box-shadow:0 8px 24px #26332b08}.card-link{display:block;text-decoration:none;color:inherit;flex:1}.cover{min-height:100px;padding:24px 23px;display:flex;align-items:center;position:relative;background:var(--soft);border-bottom:1px solid #e4ebdf;overflow:hidden}.cover svg{position:absolute;right:0;top:0;width:240px;height:120px;opacity:.7}.cover-title{position:relative;z-index:1;color:var(--green);font-size:22px;line-height:1.5;margin:0;overflow-wrap:anywhere}.body{padding:17px 23px 18px}h2{font-size:21px;font-weight:600;line-height:1.5;margin:0 0 10px;overflow-wrap:anywhere}.description{font-size:13px;line-height:1.9;margin:0 0 12px}.badge{font-size:11px;background:var(--soft);color:var(--green);padding:4px 8px;border-radius:4px}.meta{font-size:12px;color:var(--muted);margin-top:10px}.foot{display:flex;align-items:center;justify-content:space-between;padding:12px 23px;border-top:1px solid var(--line);font-size:12px}.rename{padding:0;border:0;color:var(--muted);background:none}.rename:hover{color:var(--green);text-decoration:underline}.entry{color:var(--green);text-decoration:none}.new-card{border:1px dashed #c7d4c1;border-radius:10px;background:transparent;min-height:280px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px}.new-card:hover{background:var(--bg);border-color:#75936b}.plus{font-size:30px;line-height:1.5;color:#7d9971}.new-card strong{font-size:15px;font-weight:500;color:var(--green)}.new-card small{font-size:12px}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;width:min(460px,calc(100% - 36px));color:var(--text);background:var(--paper);box-shadow:0 20px 90px #183d2920}dialog::backdrop{background:#26332b45}dialog h2{font-size:21px;margin-bottom:5px}dialog p{font-size:13px;margin:0 0 23px}label{display:block;font-size:13px;margin:16px 0 6px}input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--text)}.hint{font-size:11px;color:var(--muted);margin-top:6px}.actions{display:flex;justify-content:end;gap:10px;margin-top:26px}.cancel{padding:8px 18px;border:1px solid var(--line);background:white;border-radius:6px;color:var(--muted)}#notice{min-height:24px;color:var(--green);font-size:12px;margin-top:16px}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){header{height:auto;padding:18px 5%;flex-wrap:wrap;gap:14px}nav{order:3;width:100%;overflow:auto}nav a{padding:6px 14px}.prototype{font-size:10px}main{padding:28px 5%}.heading{align-items:start}h1{font-size:32px}.cards{grid-template-columns:1fr}.new-card{min-height:160px}.primary{padding:8px 12px;font-size:12px}.heading p{font-size:12px}.section-heading{margin-top:28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="brand">论文阅读笔记</div><nav aria-label="主导航"><a href="../../index.html#overview">总览</a><a href="../../index.html#themes">主题</a><a href="../../index.html#favorites">收藏</a><a href="../../index.html#ideas">点子</a><a class="active" href="index.html" aria-current="page">实验</a></nav><span class="prototype">HTML 原型 · 2026.11.02</span></header>
<main><div class="heading"><div><h1>实验</h1><p>每个大实验单独整理，记录一篇论文怎样一步步优化。</p></div><button class="primary" id="new">＋ 新建大实验</button></div><div class="section-heading">我的大实验 <span class="count" id="count"></span></div><div class="cards" id="cards"></div><p id="notice" role="status" aria-live="polite"></p></main>
<dialog id="editor" aria-labelledby="editor-title"><form id="form"><h2 id="editor-title">新建大实验</h2><p id="editor-intro">先给实验起个名字，之后可以随时修改。</p><div id="paper-field"><label for="paper">论文名称</label><input id="paper" placeholder="例如：HiddenDetect" maxlength="100" required></div><label for="name">大实验标题</label><input id="name" placeholder="默认：XXX论文优化" maxlength="100" required><div class="hint">默认使用“论文名称＋论文优化”，也可以自己起名。</div><div class="actions"><button class="cancel" type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<script src="projects.js"></script><script>
let projects=ExperimentProjects.all(),editing=null,custom=false;
const $=id=>document.getElementById(id),escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const art='<svg viewBox="0 0 240 120" fill="none" aria-hidden="true"><path d="M65 60H110C130 60 120 25 146 25H196M110 60H196M110 60C130 60 120 95 146 95H196" stroke="#b0c6a5" stroke-width="1.5"/><rect x="42" y="49" width="44" height="22" rx="5" fill="#c6d9bc"/><rect x="172" y="15" width="48" height="20" rx="5" fill="#dce7d6"/><rect x="172" y="50" width="48" height="20" rx="5" fill="#dce7d6"/><rect x="172" y="85" width="48" height="20" rx="5" fill="#dce7d6"/></svg>';
function render(){ $('count').textContent=projects.length+' 个';$('cards').innerHTML=projects.map(p=>{const real=p.id==='hiddendetect',url=escape(ExperimentProjects.url(p));return `<article class="card"><a class="card-link" href="${url}" aria-label="进入${escape(p.title)}"><div class="cover">${art}<h2 class="cover-title">${escape(p.title)}</h2></div><div class="body"><p class="description">${real?'围绕读取的信息、位置、层范围和算分方式，尝试把危险输入识别得更准。':'从一个想验证的问题开始，逐步整理尝试的方法和结果。'}</p><span class="badge">${real?'已有实验结果':'待开始'}</span><div class="meta">${real?'8 项实验 · 5 个方向':'0 项实验 · 等待第一条记录'}</div></div></a><div class="foot"><button class="rename" data-id="${p.id}">重命名</button><a class="entry" href="${url}">查看思维导图与表格 →</a></div></article>`;}).join('')+'<button class="new-card" id="add-card"><span class="plus">＋</span><strong>新建大实验</strong><small>为另一篇论文建立实验记录</small></button>';$('add-card').onclick=()=>open();document.querySelectorAll('.rename').forEach(b=>b.onclick=()=>open(b.dataset.id));}
function open(id){editing=id||null;custom=false;const row=projects.find(p=>p.id===id);$('form').reset();$('editor-title').textContent=row?'修改大实验标题':'新建大实验';$('editor-intro').textContent=row?'让标题更贴合你正在做的研究。':'先给实验起个名字，之后可以随时修改。';$('paper-field').hidden=!!row;$('paper').required=!row;$('paper').value=row?row.paper:'';$('name').value=row?row.title:'';$('editor').showModal();(row?$('name'):$('paper')).focus();}
$('paper').oninput=()=>{if(!custom)$('name').value=$('paper').value.trim()?$('paper').value.trim()+'论文优化':'';};$('name').oninput=()=>{custom=true;};$('new').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim(),paper=$('paper').value.trim();if(!name){$('name').setCustomValidity('请输入标题');$('name').reportValidity();return;}$('name').setCustomValidity('');if(editing)projects=projects.map(p=>p.id===editing?{...p,title:name}:p);else projects.push({id:'exp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),paper,title:name});const saved=ExperimentProjects.save(projects);render();$('editor').close();$('notice').textContent=saved?'标题已保存。':'修改已显示；当前浏览器未允许保存，刷新后可能恢复。';};$('name').addEventListener('input',()=>$('name').setCustomValidity(''));render();
</script></body></html>
